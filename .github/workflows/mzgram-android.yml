name: MZGram Android

# Builds one APK carrying all four ABIs: arm64-v8a, armeabi-v7a, x86, x86_64.
# With the signing secrets the APK is signed with the MZGram key (rotated from
# the old development key, see .github/scripts/mzgram_sign.sh), so it installs
# over a release; without them it keeps the development key and the artifact
# is named MZGram-Android-debugkey. Releases: mzgram-android-release.yml.

on:
  push:
    branches:
      - mzgram
      - 'mzgram/**'
  workflow_dispatch:

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest

    steps:
      - name: Clone.
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK.
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # v3 always tries to install the 'tools' package, which Google removed
      # from the SDK repository ("Failed to find package 'tools'", failing
      # the whole step); v4 dropped that from its default package list.
      - name: Set up Android SDK.
        uses: android-actions/setup-android@v4.0.4

      # Defensive: v4's own license pass already covers this, but accept
      # explicitly so a future package bump here can't fail on an
      # unaccepted license again.
      - name: Accept Android SDK licenses.
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Install NDK and CMake.
        run: |
          # Versions are pinned in TMessagesProj/build.gradle; anything else fails the build.
          sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-36" "build-tools;36.0.0"

      - name: Apply API credentials.
        env:
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          BUILD_VARS=TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          if [ -n "$API_ID" ] && [ -n "$API_HASH" ]; then
            sed -i "s/public static int APP_ID = [0-9]*;/public static int APP_ID = $API_ID;/" $BUILD_VARS
            sed -i "s/public static String APP_HASH = \"[0-9a-fA-F]*\";/public static String APP_HASH = \"$API_HASH\";/" $BUILD_VARS
            echo "Credentials applied."
          else
            echo "::warning::No API credentials set. The APK will build but cannot sign in."
          fi

      - name: Version.
        id: version
        run: |
          set -o pipefail
          python3 .github/scripts/test_mzgram_version.py
          # A push build gets the versionCode of the newest release tag (or the
          # gradle.properties one before the first release): it installs over the
          # last release, and the next release installs over it
          UPSTREAM=$(sed -n 's/^APP_VERSION_NAME=//p' gradle.properties)
          FLOOR=$(sed -n 's/^APP_VERSION_CODE=//p' gradle.properties)
          git ls-remote --tags origin 'refs/tags/v*' | python3 .github/scripts/mzgram_version.py dev --upstream "$UPSTREAM" --floor "$FLOOR" | tee -a "$GITHUB_OUTPUT"

      # The module has no 'release' buildType: signing and minification live on
      # 'standalone'. assembleAfatRelease produces an unsigned APK that will not install.
      - name: Build.
        env:
          CODE: ${{ steps.version.outputs.code }}
          NAME: ${{ steps.version.outputs.name }}
        run: |
          ARGS=("-PAPP_VERSION_CODE=$CODE")
          [ -z "$NAME" ] || ARGS+=("-PAPP_VERSION_NAME=$NAME")
          ./gradlew :TMessagesProj_AppStandalone:assembleAfatStandalone --console=plain "${ARGS[@]}"

      - name: Sign with the MZGram key.
        id: sign
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p artifact
          # The module overrides outputFileName, so the APK lands under intermediates too
          APK=$(find TMessagesProj_AppStandalone/build/outputs -name '*.apk' | head -1)
          bash .github/scripts/mzgram_sign_ci.sh "$APK" artifact/MZGram.apk artifact/MZGram-rotation.lineage

      - name: Verify the APK is signed.
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs artifact/MZGram.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging artifact/MZGram.apk | head -1
          ls -lh artifact/

      - name: Upload artifact.
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.sign.outputs.signed == 'true' && 'MZGram-Android' || 'MZGram-Android-debugkey' }}
          path: artifact/

  # MZGram instrumented tests (TMessagesProj_AppTests, package
  # org.telegram.messenger.mzgram.test) on a real x86_64 emulator. Includes
  # MZGramDeletedArchiveFlowTest, which drives a synthetic delete update
  # through MessagesController.processUpdateArray and checks the archive
  # database, so the deleted-message archive is verified on every push.
  mzgram-tests:
    name: MZGram instrumented tests
    runs-on: ubuntu-latest
    # A run takes about 55 minutes; an app crash the instrumentation does
    # not notice once kept the emulator waiting for hours.
    timeout-minutes: 120

    steps:
      - name: Clone.
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK.
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK.
        uses: android-actions/setup-android@v4.0.4

      - name: Accept Android SDK licenses.
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Install NDK and CMake.
        run: |
          sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-36" "build-tools;36.0.0"

      - name: Apply API credentials.
        env:
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          BUILD_VARS=TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          if [ -n "$API_ID" ] && [ -n "$API_HASH" ]; then
            sed -i "s/public static int APP_ID = [0-9]*;/public static int APP_ID = $API_ID;/" $BUILD_VARS
            sed -i "s/public static String APP_HASH = \"[0-9a-fA-F]*\";/public static String APP_HASH = \"$API_HASH\";/" $BUILD_VARS
            echo "Credentials applied."
          else
            echo "::warning::No API credentials set. The live E2E test will be skipped."
          fi

      - name: Set up Python.
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install E2E peer dependencies.
        run: pip install telethon==1.45.0

      # Checks, before the long build, whether the test-server login used by
      # the live E2E test works. Non-blocking: when it does not, the live
      # test is skipped with a warning and every other test still runs and
      # still fails the job on a real failure.
      - name: E2E peer preflight.
        env:
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          if python3 .github/scripts/mzgram_e2e_peer.py --preflight; then
            touch e2e-preflight-ok
          else
            echo "::warning::Telegram test-server login failed (see log above); the live E2E test will be skipped."
          fi

      - name: Build test APKs.
        run: ./gradlew :TMessagesProj_AppTests:assembleAfatDebug :TMessagesProj_AppTests:assembleAfatDebugAndroidTest --console=plain

      - name: Enable KVM.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Also runs MZGramDeletedArchiveLiveTest: a real deletion by a second
      # account on Telegram's TEST servers (never production), see
      # .github/scripts/mzgram_e2e_peer.py.
      - name: Run MZGram tests on emulator.
        uses: reactivecircus/android-emulator-runner@v2
        env:
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          # No cameras: opening the emulated camera hung the emulator in most runs
          # (#153, #155, #156, in MZGramAttachGalleryTest). The camera tile and
          # its tap handling do not need camera hardware; the live preview is
          # not covered by CI.
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -camera-front none
          script: |
            bash .github/scripts/mzgram_tests.sh
            bash .github/scripts/mzgram_rotation_check.sh

      - name: Upload test reports and logcat.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: MZGram-Android-tests
          path: |
            TMessagesProj_AppTests/build/reports/androidTests/
            TMessagesProj_AppTests/build/outputs/androidTest-results/
            logcat-full.txt
            e2e-peer.log
            mzgram-screens/
