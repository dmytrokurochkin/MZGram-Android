name: MZGram on exteraless

# Builds the MZGram APK of the w-ext branch (MZGram on the exteraless base) for arm64 phones,
# signed with the MZGram key like the MZGram releases, so it installs over the installed MZGram.

on:
  push:
    branches:
      - w-ext
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build the arm64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_HARDLINK: "true"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "2G"
      NATIVE_TARGET: "arm64-v8a"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: recursive
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Set up Python for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Point Chaquopy at that Python
        run: echo "CHAQUOPY_BUILD_PYTHON=$(which python3.11 || which python)" >> $GITHUB_ENV
      - name: Set up Ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: mzgram-ext-android-ndk
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Set up Android SDK Tools
        uses: android-actions/setup-android@v4
        with:
          packages: "build-tools;36.0.0 ndk;27.2.12479018 platforms;android-37.0"
      - name: Install Native Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes nasm
      - name: Configure Android SDK Path
        run: |
          echo "sdk.dir=${ANDROID_HOME}" >> local.properties
      - name: Modify Gradle JVM Args
        run: |
          MEMORY_KB=$(awk '/MemTotal/ {print $2}' /proc/meminfo)
          MEMORY_GB=$((MEMORY_KB / 1024 / 1024))
          echo "Detected memory size: ${MEMORY_GB}GB"
          if [ $MEMORY_GB -ge 12 ]; then
            sed -i '/^org\.gradle\.jvmargs=/d' gradle.properties
            echo "org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=2G -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" >> gradle.properties
          fi
      - name: Build
        env:
          COMMIT_ID: ${{ github.sha }}
          # MZGram's own Telegram API id: the session shows in Settings > Devices the way MZGram does
          TELEGRAM_APP_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_APP_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          if [ -z "$TELEGRAM_APP_ID" ] || [ -z "$TELEGRAM_APP_HASH" ]; then
            echo "::error::TELEGRAM_API_ID or TELEGRAM_API_HASH is missing in GitHub Secrets"
            exit 1
          fi
          export BUILD_TIMESTAMP=$(date +%s)
          ./gradlew TMessagesProj:assembleRelease --console=plain
      - name: Sign with the MZGram key
        id: sign
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p artifact
          APK=$(find TMessagesProj/build/outputs/apk/release -name '*.apk' | head -1)
          [ -n "$APK" ] || { echo "::error::no APK was built"; exit 1; }
          bash .github/scripts/mzgram_sign_ci.sh "$APK" artifact/MZGram.apk artifact/MZGram-rotation.lineage
      - name: Verify the APK
        env:
          SIGNED: ${{ steps.sign.outputs.signed }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Without the MZGram key the APK cannot install over the installed MZGram
          [ "$SIGNED" = "true" ] || { echo "::error::the APK is not signed with the MZGram key"; exit 1; }
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs artifact/MZGram.apk
          BADGING=$("$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging artifact/MZGram.apk | head -1)
          echo "$BADGING"
          grep -q "name='org.mzgram.messenger'" <<<"$BADGING" || { echo "::error::package name is not org.mzgram.messenger"; exit 1; }
          # Android refuses an APK whose versionCode is below the installed one, so the code must be above
          # every MZGram release tag (vX.Y.Z or vX.Y.Z-beta.N, code (X*1000000 + Y*10000 + Z*100 + N or 99) * 10 + 9)
          CODE=$(sed -nE "s/.*versionCode='([0-9]+)'.*/\1/p" <<<"$BADGING")
          NEWEST=0; NEWEST_TAG=none
          for TAG in $(gh api "repos/$GITHUB_REPOSITORY/tags?per_page=100" --paginate --jq '.[].name'); do
            [[ $TAG =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-beta\.([0-9]+))?$ ]] || continue
            N=${BASH_REMATCH[5]:-99}
            TAG_CODE=$(( (BASH_REMATCH[1] * 1000000 + BASH_REMATCH[2] * 10000 + BASH_REMATCH[3] * 100 + N) * 10 + 9 ))
            [ "$TAG_CODE" -gt "$NEWEST" ] && { NEWEST=$TAG_CODE; NEWEST_TAG=$TAG; }
          done
          echo "versionCode $CODE, newest MZGram release $NEWEST_TAG ($NEWEST)"
          [ "$NEWEST" -gt 0 ] || { echo "::error::no MZGram release tag found"; exit 1; }
          [ "$CODE" -gt "$NEWEST" ] || { echo "::error::versionCode $CODE is not above $NEWEST_TAG ($NEWEST): it will not install over MZGram"; exit 1; }
          ls -lh artifact/
      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          name: MZGram-ext-arm64
          path: artifact/MZGram.apk
          retention-days: 30
