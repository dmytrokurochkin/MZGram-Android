import java.nio.file.Paths
import org.gradle.internal.os.OperatingSystem

plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
    id 'com.chaquo.python'
    id 'org.telegram.lottie-meta'
    id 'idea'
}

idea {
    module {
        excludeDirs += [
            file('jni/third_party'),
            file('jni/ffmpeg'),
            file('jni/tlottie'),
            file('jni/boringssl'),
            file('jni/sqlite')
        ]
    }
}

def buildTimestamp = System.getenv('BUILD_TIMESTAMP') ?: '0'
def commitId = System.getenv('COMMIT_ID')
def shortCommit = commitId?.take(7) ?: ''
def verName = "${APP_VERSION_NAME}${shortCommit ? "-${shortCommit}" : ''}"
// MZGram: the MZGram releases use versionCode = MZGRAM_VERSION_CODE * 10 + 9 (1.0.10 is 10010999).
// This build must stay above the installed MZGram, otherwise Android refuses to install it over it.
def verCode = Integer.parseInt(MZGRAM_VERSION_CODE) * 10 + 9

def officialVer = APP_VERSION_NAME
def officialCode = APP_VERSION_CODE

def keystorePwd = null
def alias = null
def pwd = null

Properties properties
def base64 = System.getenv('LOCAL_PROPERTIES')
if (base64 != null && !base64.isBlank()) {
    properties = new Properties()
    properties.load(new ByteArrayInputStream(Base64.decoder.decode(base64)))
} else if (project.rootProject.file('local.properties').exists()) {
    properties = new Properties()
    properties.load(project.rootProject.file('local.properties').newDataInputStream())
}

if (properties != null) {
    keystorePwd = properties.getProperty('KEYSTORE_PASS')
    alias = properties.getProperty('ALIAS_NAME')
    pwd = properties.getProperty('ALIAS_PASS')
}

def chaquopyBuildPython = properties?.getProperty('CHAQUOPY_BUILD_PYTHON') ?: System.getenv('CHAQUOPY_BUILD_PYTHON')

keystorePwd = keystorePwd ?: System.getenv('KEYSTORE_PASS')
alias = alias ?: System.getenv('ALIAS_NAME')
pwd = pwd ?: System.getenv('ALIAS_PASS')

def nativeTarget = System.getenv('NATIVE_TARGET') ?: ''

if (nativeTarget == 'SKIP') {
    tasks.configureEach { task ->
        if (
            task.name.toLowerCase().contains('cmake') ||
            task.name.toLowerCase().contains('jni') ||
            task.name.toLowerCase().contains('test')
        ) {
            task.enabled = false
        }
    }
}

android {
    defaultConfig.applicationId = APP_PACKAGE

    androidResources {
        localeFilters += [
                'en', 'ar', 'de', 'es', 'es-rES', 'fa-rIR', 'in-rID', 'it', 'it-rIT', 'ja-rJP',
                'ko', 'nl', 'pl-rPL', 'pt-rBR', 'ru-rRU', 'tr-rTR', 'uk-rUA', 'vi-rVN', 'zh-rCN', 'zh-rTW'
        ]
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    // Target ABIs. The restriction lives in ndk.abiFilters because Chaquopy requires it;
    // see the comment at splits below.
    // 32-bit ABIs are left out on purpose: Chaquopy builds Python 3.12 only
    // for arm64-v8a and x86_64, and on armeabi-v7a the configuration fails before the build
    // ("Python 3.12 is not available for the ABI"). They can come back only together
    // with a downgrade to Python 3.11, and then the build machine, CI included, needs
    // the same minor version.
    // MZGram ships for arm64 phones only (owner's decision, 2026-11-15): an empty NATIVE_TARGET, 'universal'
    // and 'SKIP' all build arm64-v8a. Another ABI only when NATIVE_TARGET names it, for a test build
    // on an x86_64 emulator; such an APK is never released.
    def targetAbis
    if (nativeTarget.isBlank() || nativeTarget == 'universal' || nativeTarget == 'SKIP') {
        targetAbis = ['arm64-v8a']
    } else {
        targetAbis = [nativeTarget]
    }

    // splits.abi is off on purpose, not by mistake. Two restrictions
    // conflict, both checked on this tree:
    //   * without ndk.abiFilters Chaquopy fails at configuration
    //     («Chaquopy requires ndk.abiFilters»);
    //   * with abiFilters AGP rejects splits.abi.include
    //     («Conflicting configuration ... cannot be present when splits abi
    //     filters are set»).
    // So separate APKs come from a separate build per ABI, not from splits:
    // NATIVE_TARGET=arm64-v8a, then NATIVE_TARGET=x86_64.
    // An empty NATIVE_TARGET gives ONE APK with both ABIs (about +51 MB for the second
    // libtmessages.so); a warning about it goes to the log below.
    splits {
        abi {
            enable = false
        }
    }

    defaultConfig {
        versionName verName
        versionCode verCode

        // Python plugin engine (Chaquopy). ABI restriction is here (not in splits).
        ndk {
            abiFilters(*targetAbis)
        }

        python {
            version '3.11'
            if (chaquopyBuildPython != null && !chaquopyBuildPython.isBlank()) {
                buildPython chaquopyBuildPython
            }
            pip {
                install 'beautifulsoup4'
                install 'debugpy'
                install 'lxml'
                install 'packaging'
                install 'pillow'
                install 'requests'
                install 'PyYAML'
            }
        }

        // obtain your own keys at https://core.telegram.org/api/obtaining_api_id
        def appId = '6'
        def appHash = 'eb06d4abfb49dc3eeb1aeb98ae0f581e'

        // obtain your own key at https://developers.google.com/maps/documentation/android-sdk/get-api-key
        // Android keys are restricted by package name and signing certificate,
        // so a key taken from another build shows an empty map.
        def mapsKey = 'AIzaSyDE_x6GRKJCSfCY33soBYUQ2piYsgjVpVE'

        // Nothing Glyph SDK. "test" is the debug key from the Glyph Developer Kit; the production key
        // is requested from Nothing for the app's package name.
        def glyphKey = 'test'

        if (properties != null) {
            appId = properties.getProperty('TELEGRAM_APP_ID') ?: System.getenv('TELEGRAM_APP_ID') ?: appId
            appHash = properties.getProperty('TELEGRAM_APP_HASH') ?: System.getenv('TELEGRAM_APP_HASH') ?: appHash
            mapsKey = properties.getProperty('MAPS_API_KEY') ?: System.getenv('MAPS_API_KEY') ?: mapsKey
            glyphKey = properties.getProperty('GLYPH_API_KEY') ?: System.getenv('GLYPH_API_KEY') ?: glyphKey
        } else {
            mapsKey = System.getenv('MAPS_API_KEY') ?: mapsKey
            glyphKey = System.getenv('GLYPH_API_KEY') ?: glyphKey
        }

        manifestPlaceholders += [MAPS_API_KEY: mapsKey, GLYPH_API_KEY: glyphKey]

        buildConfigField 'String', 'BUILD_VERSION_STRING', '"' + APP_VERSION_NAME + '"'
        buildConfigField 'String', 'BUILD_COMMIT_ID', '"' + shortCommit + '"'
        buildConfigField 'String', 'OFFICIAL_VERSION', '"' + officialVer + '"'
        buildConfigField 'int', 'OFFICIAL_VERSION_CODE', officialCode + ''
        buildConfigField 'int', 'APP_ID', appId
        buildConfigField 'String', 'APP_HASH', '"' + appHash + '"'
        buildConfigField 'long', 'BUILD_TIMESTAMP', buildTimestamp + 'L'
        buildConfigField 'boolean', 'DEBUG_TOOLS', String.valueOf(project.findProperty('debugTools') == 'true')
        buildConfigField 'boolean', 'DEBUG_PRIVATE_VERSION', 'false'

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static', '-DANDROID_PLATFORM=android-27', '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
                System.getenv('PATH').split(File.pathSeparator).any { path ->
                    var file = Paths.get("${path}${File.separator}ccache${if (OperatingSystem.current().windows) ".exe" else ""}").toFile()
                    if (file.exists()) {
                        println("Using ccache ${file.getAbsolutePath()}")
                        arguments += "-DANDROID_CCACHE=${file.getAbsolutePath()}"
                        return true
                    }
                }
            }
        }

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ['room.schemaLocation': "$projectDir/schemas".toString()]
            }
        }
    }

    bundle {
        language {
            enableSplit = false
        }
    }

    buildFeatures {
        aidl true
    }

    externalNativeBuild {
        cmake {
            version = '3.31.6+'
            path = 'jni/CMakeLists.txt'
        }
    }

    // The signing key is not kept in the repository. Put your release.keystore next to
    // this file and set KEYSTORE_PASS / ALIAS_NAME / ALIAS_PASS in
    // local.properties; without it the build is signed with the Android debug key.
    def releaseKeystore = project.file('release.keystore')
    def hasReleaseKeystore = releaseKeystore.exists() && keystorePwd != null && alias != null

    signingConfigs {
        release {
            if (hasReleaseKeystore) {
                storeFile releaseKeystore
                storePassword keystorePwd
                keyAlias alias
                keyPassword pwd
            }
        }
    }

    buildTypes {
        debug {
            isDefault = true
            debuggable = true
            jniDebuggable = true
            multiDexEnabled = true
            signingConfig = hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
        }

        staging {
            debuggable = false
            jniDebuggable = false
            minifyEnabled = true
            shrinkResources = true
            multiDexEnabled = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            matchingFallbacks = ['release', 'staging', 'debug']
            firebaseCrashlytics {
                mappingFileUploadEnabled false
            }
            signingConfig = hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
        }

        release {
            debuggable = false
            jniDebuggable = false
            minifyEnabled = true
            shrinkResources = true
            multiDexEnabled = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            matchingFallbacks = ['release', 'staging', 'debug']
            firebaseCrashlytics {
                mappingFileUploadEnabled false
            }
            signingConfig = hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }

    sourceSets.main.jniLibs.srcDirs = ['./jni/']

    namespace = 'org.telegram.messenger'
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.forEach { output ->
            String gramName = 'MZGram'
            String first = String.format('%s-v%s(%s)', gramName, verName, verCode)
            output.outputFileName.set(
                output.outputFileName.get()
                    .replace('TMessagesProj', first)
                    .replace('-release', '')
                    .replace('-staging', '')
            )
        }
    }
}

// MZGram Python runtime: the native bridge libraries of the plugin engine are built from
// TMessagesProj/mzgram-python on every build and replace the stock ones from the Python plugin.
def mzPythonVersion = '3.11'
def mzPythonSourceDir = file('mzgram-python')
def mzPythonRuntimeDir = layout.buildDirectory.dir('mzgram-python/runtime').get().asFile
def mzPythonTarget = com.chaquo.python.internal.Common.PYTHON_VERSIONS.find { it.key.startsWith("${mzPythonVersion}.") }
def mzPythonAbis = android.defaultConfig.ndk.abiFilters.sort(false)

def mzPythonRuntimeTasks = mzPythonAbis.collect { String abi ->
    tasks.register("buildMzgramPythonRuntime${abi.split(/[-_]/)*.capitalize().join()}", Exec) {
        def targetZip = configurations.detachedConfiguration(dependencies.create(
                "com.chaquo.python:target:${mzPythonTarget.key}-${mzPythonTarget.value}:${abi}@zip"))
        def outputDir = new File(mzPythonRuntimeDir, abi)
        inputs.files(fileTree(mzPythonSourceDir) {
            include 'build.sh'
            include 'runtime/CMakeLists.txt'
            include 'runtime/src/main/c/**'
            include 'runtime/src/main/python/**/__init__.py'
            include 'runtime/src/main/python/**/*.pyx'
            include 'runtime/src/main/python/**/*.pxi'
            include 'runtime/src/main/python/**/*.pxd'
        }).withPathSensitivity(PathSensitivity.RELATIVE)
        inputs.files(targetZip).withPathSensitivity(PathSensitivity.NAME_ONLY)
        outputs.dir(outputDir)
        commandLine 'bash', new File(mzPythonSourceDir, 'build.sh').path
        environment('ABI', abi)
        environment('OUT', outputDir.path)
        environment('WORKSPACE', layout.buildDirectory.dir('mzgram-python/work').get().asFile.path)
        environment('PYTHON', chaquopyBuildPython ?: 'python3')
        environment('PYTHON_VERSION', mzPythonVersion)
        environment('CMAKE_POLICY_VERSION_MINIMUM', '3.5')
        doFirst {
            if (!new File(mzPythonSourceDir, 'runtime').isDirectory()) {
                throw new GradleException('MZGram Python runtime sources are missing: TMessagesProj/mzgram-python')
            }
            environment('NDK', androidComponents.sdkComponents.ndkDirectory.get().asFile.path)
            environment('PYTHON_TARGET_ZIP', targetZip.singleFile.path)
        }
    }
}

def overrideMzPythonRuntime = { task, String fileName, Closure<File> targetFor ->
    task.doLast {
        mzPythonAbis.each { String abi ->
            def target = targetFor(task.outputDir.get().asFile, abi)
            if (target.isDirectory()) {
                copy {
                    from new File(mzPythonRuntimeDir, "$abi/$fileName")
                    into target
                }
            }
        }
    }
}

tasks.configureEach { task ->
    if (task.name ==~ /generate\w+PythonMiscAssets|generate\w+PythonJniLibs/) {
        task.inputs.files(mzPythonRuntimeTasks)
    }
}

gradle.taskGraph.whenReady { graph ->
    graph.allTasks.each { task ->
        if (task.name ==~ /generate\w+PythonMiscAssets/) {
            overrideMzPythonRuntime(task, 'chaquopy.so') { File out, String abi ->
                new File(out, "chaquopy/bootstrap-native/$abi/java")
            }
        } else if (task.name ==~ /generate\w+PythonJniLibs/) {
            overrideMzPythonRuntime(task, 'libchaquopy_java.so') { File out, String abi ->
                new File(out, abi)
            }
        }
    }
}

configurations.configureEach {
    exclude group: 'androidx.recyclerview', module: 'recyclerview'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    // official
    implementation 'androidx.core:core-ktx:1.19.0'
    implementation 'androidx.palette:palette-ktx:1.0.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.exifinterface:exifinterface:1.4.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    implementation 'androidx.mediarouter:mediarouter:1.8.1'
    implementation 'com.google.zxing:core:3.5.4'
    implementation 'com.neovisionaries:nv-websocket-client:2.14'
    implementation 'com.caverock:androidsvg-aar:1.4'
    implementation 'androidx.sharetarget:sharetarget:1.2.0'
    implementation 'androidx.interpolator:interpolator:1.0.0'
    implementation 'androidx.webkit:webkit:1.14.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.car.app:app:1.7.0'
    implementation 'androidx.car.app:app-projected:1.7.0'
