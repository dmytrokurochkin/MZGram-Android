## Project-wide Gradle settings.
#
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
#
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx10248m -XX:MaxPermSize=256m
# org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
#
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true
#Sat Mar 12 05:53:50 MSK 2016
APP_VERSION_CODE=7303
APP_VERSION_NAME=13.2.2
# MZGram versionCode base, the same scheme as the MZGram releases (.github/scripts/mzgram_version.py on the
# MZGram branches): MAJOR * 1000000 + MINOR * 10000 + PATCH * 100 + N. 1001100 is 1.0.11 with N = 0: above the
# 1.0.10 release (1001099), below 1.0.11-beta.1 (1001101) and 1.0.11 (1001199). Never lower it.
MZGRAM_VERSION_CODE=1001100
APP_PACKAGE=org.mzgram.messenger
# Отладочный ключ Nothing Glyph SDK; боевой подставляется через GLYPH_API_KEY при сборке.
GLYPH_API_KEY=test
android.useAndroidX=true
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false
org.gradle.daemon.idletimeout=600000
org.gradle.jvmargs=-Xmx3g -XX:+UseG1GC -XX:MaxHeapFreeRatio=40 -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1g -XX:+UseG1GC -XX:MaxHeapFreeRatio=40
org.gradle.caching=true
org.gradle.vfs.watch=true
org.gradle.parallel=true
org.gradle.tooling.parallel=true
# Configuration cache is incompatible with the Chaquopy plugin (plugins engine):
# it starts external Python processes at configuration time.
org.gradle.configuration-cache=false
